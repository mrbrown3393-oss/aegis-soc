# Aegis SOC trusted ingress template.
# Render this file with envsubst so EDGE_INGRESS_TOKEN is supplied only to the
# ingress process. Never commit the rendered configuration or the token.
#
# nginx must include ngx_http_auth_request_module (--with-http_auth_request_module).
# The public listener must terminate TLS before this configuration is used.

events {}

http {
    server {
        listen 443 ssl;
        server_name aegis.example.com;

        # TLS certificate/key configuration belongs to the deployment secret store.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Do not trust client-supplied edge decision headers.
        proxy_set_header X-Aegis-Edge-Decision "";
        proxy_set_header X-Aegis-Edge-Signature "";
        proxy_set_header X-Aegis-Edge-Client-IP "";

        # The edge must be reachable only from this trusted ingress network.
        location = /_aegis_edge_auth {
            internal;
            proxy_pass http://aegis-edge:8002/v1/authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $uri;
            proxy_set_header X-Client-IP $remote_addr;
            proxy_set_header Authorization "Bearer ${EDGE_INGRESS_TOKEN}";
            proxy_set_header X-Aegis-Edge-Decision "";
            proxy_set_header X-Aegis-Edge-Signature "";
            proxy_set_header X-Aegis-Edge-Client-IP "";
        }

        location / {
            auth_request /_aegis_edge_auth;

            # Carry only the signed values returned by the trusted edge.
            auth_request_set $aegis_edge_decision $upstream_http_x_aegis_edge_decision;
            auth_request_set $aegis_edge_signature $upstream_http_x_aegis_edge_signature;
            auth_request_set $aegis_edge_client_ip $upstream_http_x_aegis_edge_client_ip;

            proxy_set_header X-Aegis-Edge-Decision $aegis_edge_decision;
            proxy_set_header X-Aegis-Edge-Signature $aegis_edge_signature;
            proxy_set_header X-Aegis-Edge-Client-IP $aegis_edge_client_ip;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://aegis-api:8001;
        }
    }
}
