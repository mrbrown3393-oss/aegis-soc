# Aegis SOC — MongoDB production configuration
# WiredTiger encryption at rest + mandatory TLS for all connections.
# See docs/mongodb-encryption.md before enabling.

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2
    collectionConfig:
      blockCompressor: snappy

security:
  # Encryption at rest (AES-256-GCM). Key file MUST be 0600, owned by mongodb,
  # and stored OUTSIDE dbPath. For production, prefer a KMIP server.
  enableEncryption: true
  encryptionCipherMode: AES256-GCM
  encryptionKeyFile: /etc/mongodb-keys/mongodb-keyfile
  # KMIP alternative (comment out encryptionKeyFile above):
  # kmip:
  #   keyIdentifier: <kmip-key-id>
  #   serverName: kmip.example.com
  #   port: 5696
  #   clientCertificateFile: /etc/mongodb-tls/kmip-client.pem
  #   serverCAFile: /etc/mongodb-tls/kmip-ca.pem
  authorization: enabled

net:
  port: 27017
  bindIp: 127.0.0.1  # tighten to private interface in clustered deployments
  tls:
    # Enforce TLS for EVERY connection — no plaintext fallback.
    mode: requireTLS
    certificateKeyFile: /etc/mongodb-tls/mongodb.pem
    CAFile: /etc/mongodb-tls/ca.pem
    # Reject anything below TLS 1.2
    disabledProtocols: TLS1_0,TLS1_1
    # Require clients (app, ops) to present certificates (mutual TLS).
    # Set to 'true' once client certs are rolled out; until then use SCRAM over TLS.
    allowConnectionsWithoutCertificates: true

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  # Never log credentials; redact client data in logs.

processManagement:
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid
