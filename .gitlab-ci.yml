# Aegis SOC — GitLab CI
stages:
  - install
  - build

variables:
  NODE_ENV: production

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - client/node_modules/

install:
  stage: install
  image: node:20-bookworm
  script:
    - npm ci --omit=optional || npm install
    - cd client && (npm ci --omit=optional || npm install)
  artifacts:
    paths:
      - node_modules/
      - client/node_modules/
    expire_in: 1 hour

build_client:
  stage: build
  image: node:20-bookworm
  needs: ["install"]
  script:
    - cd client && npx vite build
  artifacts:
    paths:
      - client/dist/
    expire_in: 7 days
