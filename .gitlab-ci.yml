# Aegis SOC — GitLab CI
stages:
  - backend
  - frontend

backend_tests:
  stage: backend
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - pytest -q ../tests

frontend_build:
  stage: frontend
  image: node:20-bookworm
  script:
    - cd client
    - npm ci --omit=optional || npm install
    - npx vite build
  artifacts:
    paths:
      - client/dist/
    expire_in: 7 days
